<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>テトリス VS CPU</title>
<style>
:root{--bg:#eef1f7;--fg:#1a2030;--panel:#fff;--line:#c5ccdc;--acc:#0f9d92;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1017;--fg:#e8ecf4;--panel:#1a2030;--line:#2e3650;--acc:#4fd1c5}}
:root[data-theme="dark"]{--bg:#0d1017;--fg:#e8ecf4;--panel:#1a2030;--line:#2e3650;--acc:#4fd1c5}
html,body{height:auto;margin:0}body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-user-select:none;user-select:none}
#app{max-width:560px;margin:0 auto;padding:8px 8px 16px}
h1{font-size:18px;margin:4px 0 8px}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
button{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
button.on{background:var(--acc);color:#04201d;border-color:var(--acc);font-weight:700}
.stage{position:relative}canvas{display:block;width:100%;border-radius:10px;touch-action:none}
#ov{position:absolute;inset:0;background:#0b0e16ee;color:#e8ecf4;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:12px}
#ov h2{margin:0;font-size:24px}#ov p{margin:0;font-size:13px;opacity:.85;white-space:pre-line}
#lvs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
#ov button{background:#1a2030;color:#e8ecf4;border-color:#2e3650}#ov button.on{background:#4fd1c5;color:#04201d}
.big{padding:12px 28px;font-weight:700}
.pad{display:none;justify-content:space-between;margin-top:10px;gap:8px}
@media (pointer:coarse),(max-width:700px){.pad{display:flex}}
.g{display:flex;gap:6px;align-items:flex-end}
.pad b{display:flex;align-items:center;justify-content:center;min-width:54px;height:54px;padding:0 6px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:18px;touch-action:none}
.pad b:active{background:var(--acc);color:#04201d}
.help{font-size:12px;line-height:1.6;opacity:.8;margin:10px 0 0}
</style></head><body>
<div id="app">
<h1>テトリス VS CPU</h1>
<div class="bar"><button id="gb"></button><button id="pb">ポーズ</button><button id="rb">パッド設定</button><button id="mb">音: ON</button><span id="lvl"></span></div><div id="pad" style="font-size:12px;margin:-4px 0 8px;opacity:.85"></div>
<div class="stage"><canvas id="c" width="560" height="480"></canvas>
<div id="ov"><h2 id="ttl">テトリス VS CPU</h2><p id="sub">CPUレベルを選んでスタート</p><div id="lvs"></div><button id="go" class="big">スタート</button></div></div>
<div class="pad"><div class="g"><b data-k="left">◀</b><b data-k="down">▼</b><b data-k="right">▶</b></div><div class="g"><b data-k="hold">HOLD</b><b data-k="ccw">↺</b><b data-k="cw">↻</b><b data-k="hard">⤓</b></div></div>
<p class="help">キーボード: ←→移動 ↓ソフト ↑/X右回転 Z左回転 Space ハード C/Shift HOLD G ガイド P ポーズ Enter 開始<br>パッド: 十字/左スティック移動 A右回転 B左回転 X/LB/RB HOLD 十字↑/RT ハード Y ガイド Start ポーズ<br>ガイド: <span style="color:var(--acc)">水色</span>=ライン消去で REN を続ける手 / 黄色=消せる手が無いときのつなぎ手</p>
</div>
<script>
const W=10,H=24,V=4,$=i=>document.getElementById(i);
const COL={I:'#37d4e8',O:'#f2d03b',T:'#b062e0',S:'#5cd45c',Z:'#ee5555',J:'#4a7de8',L:'#f09a35',G:'#7a8296'};
const BASE={I:[[0,1],[1,1],[2,1],[3,1]],O:[[0,0],[1,0],[0,1],[1,1]],T:[[1,0],[0,1],[1,1],[2,1]],S:[[1,0],[2,0],[0,1],[1,1]],Z:[[0,0],[1,0],[1,1],[2,1]],J:[[0,0],[0,1],[1,1],[2,1]],L:[[2,0],[0,1],[1,1],[2,1]]};
const N={I:4,O:2,T:3,S:3,Z:3,J:3,L:3},SH={};
for(const t in BASE){SH[t]=[];let c=BASE[t];for(let r=0;r<4;r++){SH[t].push(c);c=c.map(([x,y])=>[N[t]-1-y,x])}}
const KJ={'01':[0,0,-1,0,-1,1,0,-2,-1,-2],'10':[0,0,1,0,1,-1,0,2,1,2],'12':[0,0,1,0,1,-1,0,2,1,2],'21':[0,0,-1,0,-1,1,0,-2,-1,-2],'23':[0,0,1,0,1,1,0,-2,1,-2],'32':[0,0,-1,0,-1,-1,0,2,-1,2],'30':[0,0,-1,0,-1,-1,0,2,-1,2],'03':[0,0,1,0,1,1,0,-2,1,-2]};
const KI={'01':[0,0,-2,0,1,0,-2,-1,1,2],'10':[0,0,2,0,-1,0,2,1,-1,-2],'12':[0,0,-1,0,2,0,-1,2,2,-1],'21':[0,0,1,0,-2,0,1,-2,-2,1],'23':[0,0,2,0,-1,0,2,1,-1,-2],'32':[0,0,-2,0,1,0,-2,-1,1,2],'30':[0,0,1,0,-2,0,1,-2,-2,1],'03':[0,0,-1,0,2,0,-1,2,2,-1]};
const REN=[0,0,1,1,2,2,3,3,4,4,4,5];
const LVN=['','Lv1 入門','Lv2 初級','Lv3 中級','Lv4 上級','Lv5 最強'];
const LV=[0,{dl:1500,full:0,hold:0,d:1,noise:.5},{dl:1000,full:0,hold:1,d:1,noise:.3},{dl:700,full:1,hold:1,d:1,noise:.12},{dl:450,full:1,hold:1,d:2,k:6,noise:.04},{dl:260,full:1,hold:1,d:2,k:10,noise:0}];
const SAFE={full:1,hold:1,d:1,noise:0};
let level=3,guideOn=true,st='menu',now=0,ET=0,P,C;
/* ---- 効果音 (WebAudio) ---- */
let AC=null,mute=false;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
addEventListener('pointerdown',ac);addEventListener('keydown',ac);
function tone(f,t0,d,type='square',v=.12){const a=ac();if(!a||mute)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}
function sfx(s,combo){
 if(s.pc){[523,659,784,1047,1319].forEach((f,i)=>tone(f,i*.07,.28,'triangle',.16));return}
 if(s.ts){const b=s.ts===2?330:392;[1,1.25,1.5,2].slice(0,s.n?4:2).forEach((m,i)=>tone(b*m*(1+s.n*.12),i*.055,.2,'sawtooth',.1));tone(b*4,.22,.3,'triangle',.08);return}
 if(s.n===4){[523,659,784,1047].forEach((f,i)=>tone(f,i*.05,.22,'square',.1));return}
 if(s.n)tone([0,440,523,659][s.n],0,.15,'square',.1);
 if(combo>0)tone(330+combo*45,.08,.12,'triangle',.09)}

const hit=(b,t,r,x,y)=>SH[t][r].some(([dx,dy])=>{const cx=x+dx,cy=y+dy;return cx<0||cx>=W||cy>=H||(cy>=0&&b[cy][cx])});
function rot(b,p,d){const t=p.t;if(t==='O')return null;const r2=(p.r+d+4)%4,k=(t==='I'?KI:KJ)[''+p.r+r2];
 for(let i=0;i<5;i++){const x=p.x+k[2*i],y=p.y-k[2*i+1];if(!hit(b,t,r2,x,y))return{t,r:r2,x,y,lr:1,k4:i===4?1:0}}return null}
function sim(b,p){const nb=b.map(r=>r.slice());for(const[dx,dy]of SH[p.t][p.r]){const y=p.y+dy;if(y>=0)nb[y][p.x+dx]=p.t}
 let ts=0;if(p.t==='T'&&p.lr){const f=(x,y)=>x<0||x>=W||y>=H||(y>=0&&b[y][x])?1:0;
  const c=[f(p.x,p.y),f(p.x+2,p.y),f(p.x,p.y+2),f(p.x+2,p.y+2)];
  if(c[0]+c[1]+c[2]+c[3]>=3){const fr=[[0,1],[1,3],[2,3],[0,2]][p.r];ts=(c[fr[0]]+c[fr[1]]===2||p.k4)?1:2}}
 const keep=nb.filter(r=>!r.every(v=>v)),n=H-keep.length;while(keep.length<H)keep.unshift(Array(W).fill(0));
 
 return{nb:keep,n,ts,pc:n>0&&keep.every(r=>r.every(v=>!v))}}
function atk(s,b2b,combo){if(!s.n)return{a:0,d:0};let a=s.ts===1?[0,2,4,6][s.n]:s.ts===2?[0,0,1,2][s.n]:[0,0,1,2,4][s.n];
 const d=s.n===4||s.ts>0;if(d&&b2b)a++;a+=REN[Math.min(combo+1,11)];if(s.pc)a+=10;return{a,d}}
function place(b,t,full){const out=[],seen=new Set();
 const add=p=>{const k=SH[t][p.r].map(([a,c])=>(p.x+a)+','+(p.y+c)).sort().join(';')+p.lr;if(!seen.has(k)){seen.add(k);out.push(p)}};
 if(!full){for(let r=0;r<4;r++)for(let x=-2;x<W;x++){if(hit(b,t,r,x,3))continue;let y=3;while(!hit(b,t,r,x,y+1))y++;add({t,r,x,y,lr:0,k4:0})}return out}
 const sx=t==='O'?4:3;if(hit(b,t,0,sx,3))return out;
 const s0={t,r:0,x:sx,y:3,lr:0,k4:0},vis=new Set(),Q=[s0],K=p=>(p.y*16+p.x+3)*8+p.r*2+p.lr;vis.add(K(s0));
 for(let i=0;i<Q.length;i++){const p=Q[i];let gd=0;
  [{...p,x:p.x-1,lr:0,k4:0},{...p,x:p.x+1,lr:0,k4:0},{...p,y:p.y+1,lr:0,k4:0}].forEach((n,j)=>{if(hit(b,t,n.r,n.x,n.y)){if(j===2)gd=1;return}if(!vis.has(K(n))){vis.add(K(n));Q.push(n)}});
  [rot(b,p,1),rot(b,p,-1)].forEach(n=>{if(n&&!vis.has(K(n))){vis.add(K(n));Q.push(n)}});
  if(gd)add(p)}
 return out}
function ev(b){const h=Array(W).fill(0);let holes=0;
 for(let x=0;x<W;x++){let seen=0;for(let y=0;y<H;y++){if(b[y][x]){if(!seen){h[x]=H-y;seen=1}}else if(seen)holes++}}
 let bump=0,sum=0,mx=0;for(let x=0;x<W;x++){sum+=h[x];mx=Math.max(mx,h[x]);if(x<W-1)bump+=Math.abs(h[x]-h[x+1])}
 return -holes*9-bump*1.2-sum*.35-(mx>10?(mx-10)*6:0)}
function val(g,s){const{a}=atk(s,g.b2b,g.combo);const dirty=g.pend>0||g.b.some(r=>r.includes('G'));
 return ev(s.nb)+a*7+(s.n&&(g.combo>=0||dirty)?s.n*5:0)+(s.pc?200:0)}
function choose(g,lv){const os=[{t:g.cur.t,hold:0}];if(lv.hold&&g.can)os.push({t:g.hold||g.q[0],hold:1});
 let all=[];for(const o of os)for(const p of place(g.b,o.t,lv.full)){const s=sim(g.b,p);all.push({o,p,s,sc:val(g,s)})}
 if(!all.length)return null;all.sort((a,b)=>b.sc-a.sc);
 if(lv.d>1){all=all.slice(0,lv.k);for(const c of all){const nt=c.o.hold?(g.hold?g.q[0]:g.q[1]):g.q[0];let m=-1e9;
  for(const p of place(c.s.nb,nt,0))m=Math.max(m,val(g,sim(c.s.nb,p)));c.sc+=.8*(m>-1e9?m:-200)}all.sort((a,b)=>b.sc-a.sc)}
 return Math.random()<lv.noise?all[Math.floor(Math.random()*Math.min(4,all.length))]:all[0]}
/* 堀りRENガイド: 毎手ラインを消す手だけを3手先まで探索し、最長の連鎖(→地形評価)で選ぶ */
function guide(g){const os=[{hold:0,seq:[g.cur.t,...g.q]}];
 if(g.can)os.push({hold:1,seq:[g.hold||g.q[0],...(g.hold?g.q:g.q.slice(1))]});
 const rec=(b,i,seq)=>{let bs=null;if(i<3)for(const p of place(b,seq[i],i===0)){const s=sim(b,p);if(!s.n)continue;
  const r=rec(s.nb,i+1,seq),o={len:1+r.len,v:r.v+s.n*6,p};if(!bs||o.len*1e3+o.v>bs.len*1e3+bs.v)bs=o}
  return bs||{len:0,v:ev(b)}};
 let best=null;for(const o of os){const r=rec(g.b,0,o.seq),k=r.len*1e3+r.v-o.hold*5;if(r.len&&(!best||k>best.k))best={p:r.p,hold:o.hold,kind:'ren',len:r.len,k}}
 if(best)return best;const m=choose(g,SAFE);return m?{p:m.p,hold:m.o.hold,kind:'safe',len:0}:null}

class G{
 constructor(main){this.main=main;this.b=Array.from({length:H},()=>Array(W).fill(0));this.bag=[];this.q=[];for(let i=0;i<6;i++)this.q.push(this.dr());
  this.hold=null;this.can=true;this.combo=-1;this.b2b=false;this.pend=0;this.hc=Math.floor(Math.random()*W);this.dead=false;this.msg='';this.mt=0;this.sent=0;this.ct=0;this.gd=null;this.gt=0;this.lt=0;this.lres=0;this.spawn()}
 dr(){if(!this.bag.length)this.bag=[...'IOTSZJL'].sort(()=>Math.random()-.5);return this.bag.pop()}
 spawn(t){if(!t){t=this.q.shift();this.q.push(this.dr())}
  this.cur={t,r:0,x:t==='O'?4:3,y:3,lr:0,k4:0};this.gt=0;this.lt=0;this.lres=0;
  if(hit(this.b,t,0,this.cur.x,3)){this.dead=true;this.gd=null}else this.gd=this.main&&guideOn?guide(this):null}
 doHold(){if(this.dead||!this.can)return;const h=this.hold;this.hold=this.cur.t;this.can=false;h?this.spawn(h):this.spawn()}
 gnd(){const c=this.cur;return hit(this.b,c.t,c.r,c.x,c.y+1)}
 touched(){if(this.gnd()){if(this.lres<15){this.lt=0;this.lres++}}else this.lt=0}
 move(d){if(this.dead)return;const c=this.cur;if(!hit(this.b,c.t,c.r,c.x+d,c.y)){c.x+=d;c.lr=0;c.k4=0;this.touched()}}
 rotate(d){if(this.dead)return;const n=rot(this.b,this.cur,d);if(n){this.cur=n;this.touched()}}
 soft(){const c=this.cur;if(!this.dead&&!this.gnd()){c.y++;c.lr=0;c.k4=0}}
 hard(){if(this.dead)return;const c=this.cur;while(!this.gnd()){c.y++;c.lr=0;c.k4=0}this.lock()}
 update(dt){if(this.dead)return;this.mt-=dt;this.gt+=dt;const iv=800;
  while(this.gt>=iv){this.gt-=iv;if(!this.gnd()){this.cur.y++;this.cur.lr=0;this.cur.k4=0}else{this.gt=0;break}}
  if(this.gnd()){this.lt+=dt;if(this.lt>=500)this.lock()}else this.lt=0}
 cpu(dt){this.mt-=dt;if(this.dead)return;this.ct+=dt;const lv=LV[level];if(this.ct<lv.dl)return;this.ct=0;
  const m=choose(this,lv);if(!m){this.dead=true;return}
  if(m.o.hold){this.doHold();if(this.dead)return}
  this.cur={...m.p};this.lock()}
 lock(){const s=sim(this.b,this.cur),pb=this.b2b,{a,d}=atk(s,pb,this.combo);this.b=s.nb;
  if(s.n){this.combo++;this.b2b=!!d}else this.combo=-1;
  const l1=((s.n&&d&&pb)?'B2B ':'')+(s.ts?'T-SPIN'+(s.ts===2?' MINI ':' '):'')+['','SINGLE','DOUBLE','TRIPLE','TETRIS'][s.n];
  const L=[l1.trim()];if(this.combo>0)L.push('REN '+this.combo);if(s.pc)L.push('PERFECT CLEAR');
  this.msg=L.filter(Boolean).join('|');if(this.msg)this.mt=1600;
  if(this.main)sfx(s,this.combo);
  let out=a;if(out&&this.pend){const c=Math.min(this.pend,out);this.pend-=c;out-=c}
  if(out&&this.opp){this.opp.pend+=out;this.sent+=out}
  if(!s.n)this.addG();this.can=true;if(!this.dead)this.spawn()}
 addG(){let k=Math.min(this.pend,8);this.pend-=k;while(k-->0){if(Math.random()<.3)this.hc=Math.floor(Math.random()*W);
  if(this.b.shift().some(v=>v))this.dead=true;const r=Array(W).fill('G');r[this.hc]=0;this.b.push(r)}}
}

/* ---- 描画 ---- */
const cv=$('c'),cx=cv.getContext('2d');
function cell(x,y,s,c,a=1){cx.globalAlpha=a;cx.fillStyle=c;cx.fillRect(x,y,s-1,s-1);cx.globalAlpha=1}
function mini(t,x,y,s,a=1){SH[t][0].forEach(([dx,dy])=>cell(x+(dx+(4-N[t])/2)*s,y+dy*s,s,COL[t],a))}
function board(g,ox,oy,s,main){const h=(H-V)*s;cx.fillStyle='#0a0d15';cx.fillRect(ox,oy,W*s,h);
 cx.strokeStyle='#ffffff12';cx.lineWidth=1;cx.beginPath();for(let i=0;i<=W;i++){cx.moveTo(ox+i*s,oy);cx.lineTo(ox+i*s,oy+h)}cx.stroke();
 for(let y=V;y<H;y++)for(let x=0;x<W;x++){const v=g.b[y][x];if(v)cell(ox+x*s,oy+(y-V)*s,s,COL[v])}
 cx.fillStyle='#ff4d4d';const ph=Math.min(g.pend,20)*s;cx.fillRect(ox-7,oy+h-ph,4,ph);
 if(!g.dead){const c=g.cur,pc=(p,f)=>SH[p.t][p.r].forEach(([dx,dy])=>{const yy=p.y+dy-V;if(yy>=0)f(ox+(p.x+dx)*s,oy+yy*s)});
  if(main){let y=c.y;while(!hit(g.b,c.t,c.r,c.x,y+1))y++;pc({...c,y},(a,b)=>cell(a,b,s,COL[c.t],.22));
   if(guideOn&&g.gd){const col=g.gd.kind==='ren'?'#4fd1c5':'#ffd54a';
    pc(g.gd.p,(a,b)=>{cx.fillStyle=col+'44';cx.fillRect(a,b,s-1,s-1);cx.strokeStyle=col;cx.lineWidth=2;cx.strokeRect(a+1,b+1,s-3,s-3)})}}
  pc(c,(a,b)=>cell(a,b,s,COL[c.t]))}
 if(g.mt>0&&g.msg){const fs=main?15:11;cx.globalAlpha=Math.min(1,g.mt/400);cx.fillStyle='#fff';cx.font=`bold ${fs}px sans-serif`;cx.textAlign='center';
  g.msg.split('|').forEach((l,i)=>cx.fillText(l,ox+W*s/2,oy+h*.3+i*(fs+4)));cx.globalAlpha=1;cx.textAlign='left'}}
function txt(t,x,y,f=11,c='#c8cfe0'){cx.fillStyle=c;cx.font=f+'px sans-serif';cx.fillText(t,x,y)}
function draw(){cx.fillStyle='#141a28';cx.fillRect(0,0,560,480);cx.textBaseline='top';
 txt('YOU',90,12,13,'#e8ecf4');txt('CPU '+LVN[level],400,12,13,'#e8ecf4');
 board(P,90,34,22,1);board(C,400,34,14,0);
 const hb=P.gd&&P.gd.hold&&guideOn;cx.strokeStyle=hb?'#4fd1c5':'#2e3650';cx.lineWidth=2;cx.strokeRect(8,34,72,52);
 txt(hb?'HOLD!':'HOLD',12,38,10,hb?'#4fd1c5':'#8b94ab');if(P.hold)mini(P.hold,14,56,14,P.can?1:.35);
 txt('NEXT',322,34,10,'#8b94ab');for(let i=0;i<5;i++)mini(P.q[i],324,52+i*44,14);
 txt('送信 '+P.sent,8,100);txt('REN '+Math.max(0,P.combo),8,116);txt('B2B '+(P.b2b?'ON':'-'),8,132);txt('受け '+P.pend,8,148,11,P.pend?'#ff7777':'#c8cfe0');
 txt('ガイド '+(guideOn?'ON':'OFF'),8,172,11,guideOn?'#4fd1c5':'#8b94ab');
 if(guideOn&&P.gd){txt(P.gd.kind==='ren'?'消去×'+P.gd.len+'連':'つなぎ手',8,188,11,P.gd.kind==='ren'?'#4fd1c5':'#ffd54a')}
 txt('送信 '+C.sent,400,322);txt('受け '+C.pend,400,338,11,C.pend?'#ff7777':'#c8cfe0');
 if(st==='pause'){cx.fillStyle='#000a';cx.fillRect(90,34,220,440);cx.fillStyle='#fff';cx.font='bold 22px sans-serif';cx.textAlign='center';cx.fillText('PAUSE',200,240);cx.textAlign='left'}}

/* ---- 入力 ---- */
const held={left:0,right:0,down:0};let dir=0,dasNext=0,sdT=0;
const clearHeld=()=>{held.left=held.right=held.down=0;dir=0};
function setLv(l){level=Math.max(1,Math.min(5,l));[...$('lvs').children].forEach((b,i)=>b.className=i+1===level?'on':'');$('lvl').textContent='CPU: '+LVN[level]}
function start(){P=new G(1);C=new G(0);P.opp=C;C.opp=P;ET=0;clearHeld();st='play';$('ov').style.display='none'}
function end(){st='menu';clearHeld();$('ttl').textContent=P.dead&&C.dead?'DRAW':P.dead?'YOU LOSE':'YOU WIN!';
 $('sub').textContent=`送信ライン  あなた ${P.sent} / CPU ${C.sent}\nレベルを選んでもう一度`;$('go').textContent='もう一度';$('ov').style.display='flex'}
function toggleGuide(){guideOn=!guideOn;$('gb').textContent='堀りRENガイド: '+(guideOn?'ON':'OFF');$('gb').className=guideOn?'on':'';
 if(P&&st!=='menu')P.gd=guideOn&&!P.dead?guide(P):null}
function press(n){
 if(n==='guide'){toggleGuide();return}
 if(st==='menu'){if(n==='left')setLv(level-1);else if(n==='right')setLv(level+1);else if(['start','cw','pause','hard'].includes(n))start();return}
 if(st==='pause'){if(n==='pause')st='play';return}
 if(P.dead)return;
 switch(n){case'left':case'right':held[n]=1;dir=n==='left'?-1:1;P.move(dir);dasNext=now+150;break;
  case'down':held.down=1;break;case'cw':P.rotate(1);break;case'ccw':P.rotate(-1);break;case'hard':P.hard();break;case'hold':P.doHold();break;case'pause':st='pause';clearHeld()}}
function release(n){if(n==='left'||n==='right'){held[n]=0;if(dir===(n==='left'?-1:1)){dir=held.left?-1:held.right?1:0;dasNext=now+120}}else if(n==='down')held.down=0}
const KM={ArrowLeft:'left',ArrowRight:'right',ArrowDown:'down',ArrowUp:'cw',x:'cw',z:'ccw',' ':'hard',c:'hold',Shift:'hold',g:'guide',p:'pause',Escape:'pause',Enter:'start'};
const kn=e=>KM[e.key.length===1?e.key.toLowerCase():e.key];
addEventListener('keydown',e=>{const n=kn(e);if(n){e.preventDefault();if(!e.repeat)press(n)}});
addEventListener('keyup',e=>{const n=kn(e);if(n)release(n)});
document.querySelectorAll('.pad b').forEach(el=>{const k=el.dataset.k;
 el.addEventListener('pointerdown',e=>{e.preventDefault();press(k)});
 ['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,()=>release(k)));
 el.addEventListener('contextmenu',e=>e.preventDefault())});
let gp={};
const ACT=[['left','左'],['right','右'],['down','ソフトドロップ'],['hard','ハードドロップ'],['cw','右回転'],['ccw','左回転'],['hold','HOLD'],['guide','ガイド切替'],['pause','ポーズ/開始']];
let map=null,remapI=-1,padId='',prevAny=[];
try{map=JSON.parse(localStorage.getItem('padmap')||'null')}catch(e){}
const pk=c=>c[0]==='a'?c.split(':')[0]+(+c.split(':')[1]>0?'+':'-'):c;
function pollPad(){const p=[...(navigator.getGamepads?navigator.getGamepads():[])].find(x=>x&&x.connected);
 if(!p){if(padId){padId='';$('pad').textContent='パッド: 未検出（ボタンを押してください）'}return}
 if(padId!==p.id){padId=p.id;$('pad').textContent='パッド検出: '+p.id.slice(0,44)+(p.mapping==='standard'?'':' (非標準→「パッド設定」を押してください)')}
 const b=i=>p.buttons[i]&&p.buttons[i].pressed;
 if(remapI>=0){const cur=[];p.buttons.forEach((x,i)=>{if(x.pressed)cur.push('b'+i)});p.axes.forEach((v,i)=>{if(Math.abs(v)>.6&&Math.abs(v)<1.5)cur.push('a'+i+':'+v.toFixed(2))});
  const nw=cur.find(c=>!prevAny.includes(pk(c)));prevAny=cur.map(pk);
  if(nw){map[ACT[remapI][0]]=nw;remapI++;if(remapI>=ACT.length){remapI=-1;try{localStorage.setItem('padmap',JSON.stringify(map))}catch(e){}$('pad').textContent='パッド設定完了';gp={}}else $('pad').textContent='パッド設定: 「'+ACT[remapI][1]+'」に使うボタンを押してください'}
  return}
 const inp=c=>{if(!c)return false;if(c[0]==='b')return b(+c.slice(1));const[i,t]=c.slice(1).split(':'),v=p.axes[+i],T=+t;return v!==undefined&&(Math.abs(v-T)<.2||(Math.abs(T)>.95&&v*T>.6&&Math.abs(v)<1.5))};
 const s=map&&map.left?Object.fromEntries(ACT.map(([k])=>[k,inp(map[k])])):{left:b(14)||p.axes[0]<-.5,right:b(15)||p.axes[0]>.5,down:b(13)||p.axes[1]>.6,hard:b(12)||b(6)||b(7),cw:b(0),ccw:b(1),hold:b(2)||b(4)||b(5),guide:b(3),pause:b(9)};
 for(const k in s){if(s[k]&&!gp[k])press(k);else if(!s[k]&&gp[k])release(k)}gp=s}

/* ---- メインループ ---- */
let last=0;
function loop(t){requestAnimationFrame(loop);try{tick(t)}catch(e){console.error(e)}}
function tick(t){now=t;const dt=Math.min(50,t-last);last=t;pollPad();
 if(st==='play'){ET+=dt;
  while(dir&&now>=dasNext&&!P.dead){P.move(dir);dasNext+=35}
  if(held.down){sdT+=dt;while(sdT>=30){sdT-=30;P.soft()}}else sdT=0;
  P.update(dt);C.cpu(dt);if(P.dead||C.dead)end()}
 draw()}
for(let i=1;i<=5;i++){const b=document.createElement('button');b.textContent=LVN[i];b.onclick=()=>setLv(i);$('lvs').appendChild(b)}
$('go').onclick=start;$('mb').onclick=()=>{mute=!mute;$('mb').textContent='音: '+(mute?'OFF':'ON')};$('rb').onclick=()=>{map={};remapI=0;prevAny=[];$('pad').textContent='パッド設定: 「'+ACT[0][1]+'」に使うボタンを押してください'};$('gb').onclick=toggleGuide;$('pb').onclick=()=>{if(st!=='menu')press('pause')};
guideOn=!guideOn;toggleGuide();setLv(3);P=new G(1);C=new G(0);P.opp=C;C.opp=P;
requestAnimationFrame(loop);
</script></body></html>
